    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "name": "@inkcode.web",
            "description": "Criamos websites modernos, rápidos e personalizados para tatuadores e estúdios de tatuagem em Portugal.",

          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Preciso de saber programar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Não. Tratamos de todo o processo técnico."
                }
              },
              {
                "@type": "Question",
                "name": "Posso escolher o design?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. Cada website é desenvolvido de acordo com o teu estilo, identidade e objectivos."
                }
              },
              {
                "@type": "Question",
                "name": "O site funciona no telemóvel?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. Todos os websites são pensados para funcionar em smartphones, tablets e computadores."
                }
              },
              {
                "@type": "Question",
                "name": "Posso adicionar novas tatuagens ao portfólio?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. A solução pode ser preparada para permitir actualizações futuras."
                }
              },
              {
                "@type": "Question",
                "name": "Vocês tratam do domínio?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Disponibilizamos junto ao site o domínio e a hospedagem na Vercel."
                }
              },
              {
                "@type": "Question",
                "name": "Quanto tempo demora?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A @inkcode.web faz e entrega o teu website pronto em 24h."
                }
              }
            ]
